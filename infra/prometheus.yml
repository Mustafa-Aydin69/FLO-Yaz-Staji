global:
  scrape_interval: 10s

scrape_configs:
  - job_name: search-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["search-service:8081"]

  - job_name: cart-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cart-service:8082"]

  - job_name: payment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-service:8083"]

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["inventory-service:8084"]
