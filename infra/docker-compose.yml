name: flo

networks:
  flo-network:
    name: flo-network
    driver: bridge

services:
  search-service:
    build:
      context: ../services/search-service
    ports:
      - "${SEARCH_SERVICE_PORT:-8081}:8081"
    environment:
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - flo-network
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  cart-service:
    build:
      context: ../services/cart-service
    ports:
      - "${CART_SERVICE_PORT:-8082}:8082"
    environment:
      - SEARCH_SERVICE_BASE_URL=${SEARCH_SERVICE_DOCKER_URL:-http://search-service:8081}
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - flo-network
    depends_on:
      search-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  payment-service:
    build:
      context: ../services/payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT:-8083}:8083"
    environment:
      - CART_SERVICE_BASE_URL=${CART_SERVICE_DOCKER_URL:-http://cart-service:8082}
      - INVENTORY_SERVICE_BASE_URL=${INVENTORY_SERVICE_DOCKER_URL:-http://inventory-service:8084}
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - flo-network
    depends_on:
      cart-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  inventory-service:
    build:
      context: ../services/inventory-service
    ports:
      - "${INVENTORY_SERVICE_PORT:-8084}:8084"
    environment:
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    networks:
      - flo-network
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.158.0
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_GRPC_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_PORT:-4318}:4318"
      - "${OTEL_COLLECTOR_HEALTH_PORT:-13133}:13133"
    networks:
      - flo-network
    depends_on:
      - jaeger
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - MEMORY_MAX_TRACES=10000
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    networks:
      - flo-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - flo-network
    depends_on:
      - search-service
      - cart-service
      - payment-service
      - inventory-service
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - flo-network
    depends_on:
      - prometheus
      - jaeger
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
