# Faz 7'de bu dosya infra/docker-compose.yml altina tasinacak.

services:
  search-service:
    build:
      context: ./services/search-service
    ports:
      - "${SEARCH_SERVICE_PORT:-8081}:8081"

  cart-service:
    build:
      context: ./services/cart-service
    ports:
      - "${CART_SERVICE_PORT:-8082}:8082"
    environment:
      - SEARCH_SERVICE_BASE_URL=http://search-service:8081
