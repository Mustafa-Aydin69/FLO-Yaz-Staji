server:
  port: 8083
  error:
    include-message: always

spring:
  application:
    name: payment-service

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

cart-service:
  base-url: http://localhost:8082

inventory-service:
  base-url: http://localhost:8084

otel:
  service:
    name: ${OTEL_SERVICE_NAME:payment-service}
  instrumentation:
    spring-webmvc:
      enabled: ${OTEL_INSTRUMENTATION_SPRING_WEBMVC_ENABLED:true}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:logging}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
